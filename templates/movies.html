<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Movies</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="/" class="logo">🎬 MovieTickets</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/movies">Movies</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">All Movies</h1>
        <div class="movie-grid">
            {% for movie in movies %}
            <div class="movie-card">
                <div class="movie-icon">{{ movie.image }}</div>
                <h3>{{ movie.title }}</h3>
                <p class="genre">{{ movie.genre }}</p>
                <p class="rating">⭐ {{ movie.rating }}</p>
                <div class="showtimes">
                    <small>Showtimes:</small>
                    {% for time in movie.showtimes %}
                    <span class="time-tag">{{ time }}</span>
                    {% endfor %}
                </div>
                <a href="/book/{{ movie.id }}" class="btn btn-small">Book Now</a>
            </div>
            {% endfor %}
        </div>
    </div>

    <footer>
        <p>© 2026 MovieTickets</p>
    </footer>
</body>
</html>
