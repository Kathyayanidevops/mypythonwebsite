<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tickets</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="/" class="logo">🎬 MovieTickets</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/movies">Movies</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="booking-box">
            <h1>Book Tickets</h1>
            <h2 class="movie-title">{{ movie.title }}</h2>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" class="booking-form">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" name="name" required>
                </div>

                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" name="email" required>
                </div>

                <div class="form-group">
                    <label>Showtime *</label>
                    <select name="showtime" required>
                        <option value="">Select showtime</option>
                        {% for time in movie.showtimes %}
                        <option value="{{ time }}">{{ time }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Number of Seats</label>
                    <input type="number" name="seats" min="1" max="10" value="1">
                </div>

                <button type="submit" class="btn btn-primary">Confirm Booking</button>
                <a href="/movies" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2026 MovieTickets</p>
    </footer>
</body>
</html>
